<div id="main-body" class="row">
  <div class="col-xl-8 col-lg-10">
    <div class="card my-4">
      <div class="card-header p-3 pb-0">
        <h5 class="mb-0">{{ page_title }}</h5>
      </div>
      <div class="card-body">
        {% if page_title == 'Verify payment' %}<p>Set status to Completed to approve this payment and activate the student's enrollment. The student will then be able to open course lessons.</p>{% endif %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="form-actions">
            <button class="btn bg-gradient-dark mb-0" type="submit"><i class="ni ni-check-bold me-1" aria-hidden="true"></i>{{ submit_label|default:"Save" }}</button>
            <a class="form-cancel-link" href="{% url return_url %}"><i class="ni ni-bold-left me-1" aria-hidden="true"></i>Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
